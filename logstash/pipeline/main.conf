# Main pipeline: consume evaluation events from RabbitMQ, normalize, index.
# The rabbitmq input owns subscription/acks/reconnects; acking after the event
# is in Logstash's persistent queue keeps the no-data-loss chain intact.

input {
  rabbitmq {
    host => "rabbitmq"
    port => 5672
    user => "${RABBITMQ_USER:weather}"
    password => "${RABBITMQ_PASS:weather}"
    queue => "weather-events"
    durable => true
    ack => true
    prefetch_count => 64
    codec => "json"
  }
}

filter {
  # A message without event_id (a _jsonparsefailure from the json codec, a
  # hand-published test message, a foreign producer) would otherwise index
  # under the literal document id "%{event_id}" — every such message silently
  # clobbering the previous one. Give it a fresh id and tag it for triage.
  if ![event_id] {
    uuid { target => "event_id" }
    mutate { add_tag => ["missing_event_id"] }
  }

  # The producer's event time (not ingest time) becomes @timestamp.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "weather-recs-%{+YYYY.MM.dd}"
    # The producer's UUID as document id makes redelivery idempotent:
    # at-least-once delivery becomes exactly-once storage.
    document_id => "%{event_id}"
  }
}
