# DLQ reprocessor: events the ES output rejected (mapping conflicts, 400/404)
# land in the dead letter queue; this pipeline re-indexes them into
# weather-recs-dlq so poison messages are visible in Grafana instead of
# silently parked. Since we control the producer, this index staying empty is
# itself a monitored signal.

input {
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "main"
    commit_offsets => true
  }
}

filter {
  mutate {
    # Why the event was dead-lettered, kept alongside the original document.
    add_field => {
      "[dlq][reason]" => "%{[@metadata][dead_letter_queue][reason]}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "weather-recs-dlq"
  }
}
