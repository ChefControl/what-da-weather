# Activity rules and scheduler configuration.
#
# Deserialized at startup into strict Rust types (serde, deny_unknown_fields):
# a malformed file fails startup loudly instead of silently misbehaving.
#
# Each activity has:
#   require_daylight — optional hard gate: only possible while the sun is up
#                      at the evaluated location (Open-Meteo is_day).
#   required  — hard gate, deliberately LOOSE: it blocks only conditions that
#               make the activity impossible or unsafe. Any violation =>
#               "not recommended", LLM not consulted.
#   prompt    — free-text guidance sent to the LLM alongside the weather data.
#               All nuance ("pleasantly warm", "better indoors when muggy")
#               lives here; the LLM produces the verdict within the gate.
#
# Constraint params: temperature_c, wind_kmh, humidity_pct, precipitation_mm,
# cloud_cover_pct, visibility_km. Each constraint needs `min`, `max`, or both.

scheduler:
  interval_minutes: 10
  cities:
    - "Tel Aviv"
    - "Haifa"
    - "Eilat"

activities:
  matkot:
    name: "Matkot at the beach"
    require_daylight: true
    required:
      - param: temperature_c
        min: 15
        max: 38
        description: "Not brutally cold or dangerously hot (15-38 C)"
      - param: wind_kmh
        max: 20
        description: "Wind below 20 km/h - beyond that the ball won't fly straight"
      - param: visibility_km
        min: 1
        description: "Visibility must not be extremely low"
      - param: precipitation_mm
        max: 2
        description: "No real rain"
    prompt: >-
      Matkot is a beach paddle-ball game played outdoors on the sand.
      It is best on a warm, sunny, calm day: roughly 22-31 C, light wind
      (the ball is very light), moderate humidity and no rain. High humidity
      makes it sweaty and unpleasant; strong wind ruins the rallies.
      Recommend it only when conditions make for an enjoyable beach session.

  nature:
    name: "Nature sightseeing"
    require_daylight: true
    required:
      - param: temperature_c
        min: 8
        max: 38
        description: "Not freezing or dangerously hot (8-38 C)"
      - param: wind_kmh
        max: 50
        description: "No storm-force wind"
      - param: visibility_km
        min: 3
        description: "Sightseeing needs sight"
    prompt: >-
      Nature sightseeing means walking outdoor trails and viewpoints.
      Ideal conditions: mild temperatures around 15-28 C, calm or light wind,
      dry weather and clear air with long visibility for the views.
      Heat above ~30 C, rain, fog or strong wind make it unpleasant.
      Recommend it only when the outing would genuinely be enjoyable.

  gaming:
    name: "Gaming (indoors)"
    # Indoors: no hard gate. The prompt encodes the inverse preference.
    required: []
    prompt: >-
      Gaming happens indoors, so the weather can never prevent it - the only
      question is whether staying in beats going out. Apply this decision rule
      in order:
      (1) If it is nighttime, recommended=true - outdoor activities are done
      for the day.
      (2) If the weather outside is harsh - hotter than ~32 C, colder than
      ~10 C, wind above ~30 km/h, rain, or humidity above ~70% (muggy) -
      recommended=true: a great time to stay in and game.
      (3) Otherwise the weather is pleasant for being outdoors:
      recommended=false, better to go outside.
