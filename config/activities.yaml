# Activity rules and scheduler configuration.
#
# Deserialized at startup into strict Rust types (serde, deny_unknown_fields):
# a malformed file fails startup loudly instead of silently misbehaving.
#
# Each activity has:
#   require_daylight — optional hard gate: only possible while the sun is up
#                      at the evaluated location (Open-Meteo is_day).
#   required  — hard gate. Any violation => "not recommended", LLM not consulted.
#   preferred — soft preferences. Fed to the LLM as ranking input; also used for
#               the rule-based fallback verdict when the LLM is unavailable
#               (recommended when at least half are satisfied).
#
# Constraint params: temperature_c, wind_kmh, humidity_pct, precipitation_mm,
# cloud_cover_pct, visibility_km. Each constraint needs `min`, `max`, or both.

scheduler:
  interval_minutes: 10
  cities:
    - "Tel Aviv"
    - "Haifa"
    - "Eilat"

activities:
  matkot:
    name: "Matkot at the beach"
    # Comfortable temp, almost no wind, visibility not extremely low, sun up.
    require_daylight: true
    required:
      - param: temperature_c
        min: 18
        max: 34
        description: "Comfortable beach temperature (18-34 C)"
      - param: wind_kmh
        max: 12
        description: "Almost no wind - the ball flies straight"
      - param: visibility_km
        min: 2
        description: "Visibility must not be extremely low"
      - param: precipitation_mm
        max: 0.5
        description: "No meaningful rain"
    preferred:
      - param: temperature_c
        min: 23
        max: 30
        description: "Pleasantly warm (23-30 C)"
      - param: cloud_cover_pct
        max: 40
        description: "Mostly sunny"
      - param: humidity_pct
        max: 65
        description: "Not muggy"

  nature:
    name: "Nature sightseeing"
    # Comfortable temp, no extreme wind, good visibility, sun up.
    require_daylight: true
    required:
      - param: temperature_c
        min: 12
        max: 34
        description: "Comfortable temperature (12-34 C)"
      - param: wind_kmh
        max: 40
        description: "No extreme wind"
      - param: visibility_km
        min: 5
        description: "Good visibility - sightseeing needs sight"
    preferred:
      - param: temperature_c
        min: 16
        max: 28
        description: "Pleasant hiking temperature (16-28 C)"
      - param: visibility_km
        min: 15
        description: "Crisp long-distance views"
      - param: wind_kmh
        max: 20
        description: "Calm air"

  gaming:
    name: "Gaming (indoors)"
    # The inverse preference: harsh weather outside makes gaming rank higher.
    # Visibility and sun position deliberately do not matter.
    required: []
    preferred:
      - param: temperature_c
        min: 30
        description: "Hot outside - better in the AC"
      - param: wind_kmh
        min: 25
        description: "Windy outside"
