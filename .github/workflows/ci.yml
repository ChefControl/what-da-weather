# CI on every push/PR; CD (image push to GHCR) on main (DESIGN.md D10).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # includes tsc --noEmit

  image:
    name: Docker image (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write # semver step pushes the vX.Y.Z git tag on main
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the semver bump is computed from tags + commits
      - uses: docker/setup-buildx-action@v4
      # Automatic semantic versioning: each main push creates the next vX.Y.Z
      # git tag (patch by default; feat:/BREAKING CHANGE commits bump
      # minor/major) and the image is tagged with it alongside latest + sha.
      - name: Compute and push next semver tag (main only)
        id: semver
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
      - name: Assemble image tags
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo 'ghcr.io/chefcontrol/what-da-weather:latest'
            echo 'ghcr.io/chefcontrol/what-da-weather:${{ github.sha }}'
            if [ -n '${{ steps.semver.outputs.new_tag }}' ]; then
              echo 'ghcr.io/chefcontrol/what-da-weather:${{ steps.semver.outputs.new_tag }}'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          # GHA layer cache + cargo-chef keep Rust dependency rebuilds off the
          # critical path: only manifest changes invalidate the cook layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A tag alone is easy to miss; publish it as a real GitHub release with
      # auto-generated notes. Runs after the image push so a release always
      # corresponds to a shipped image.
      - name: Create GitHub release for the new tag (main only)
        if: steps.semver.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create '${{ steps.semver.outputs.new_tag }}' --verify-tag --generate-notes
